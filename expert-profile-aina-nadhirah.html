<!DOCTYPE html>

<title>Aina Nadhirah binti Mohd Khairi — Expert Profile | FCOM, UPTM</title>
<style>
  :root{ --ink:#0B1A45; --slate:#5B6472; --line:#E4E7EE; --red:#D71A28; }
  *{box-sizing:border-box;}
  body{margin:0;padding:40px 16px 60px;background:#F5F6F9;font-family:'Inter',Arial,sans-serif;color:var(--ink);}
  .wrap{max-width:520px;margin:0 auto;}

  .profile-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px 28px 30px;text-align:center;box-shadow:0 10px 30px rgba(11,26,69,0.08);}

  .profile-photo{width:auto;max-width:190px;height:auto;max-height:220px;display:block;filter:drop-shadow(0 14px 22px rgba(11,26,69,0.22));}
  h1{font-size:1.25rem;margin:0 0 6px;}
  .profile-role{font-size:0.8rem;color:var(--red);font-weight:700;letter-spacing:0.03em;text-transform:uppercase;margin:0 0 14px;}
  .profile-email{font-size:0.9rem;margin:0;}
  .profile-email a{color:var(--slate);text-decoration:none;font-weight:600;}
  .profile-email a:hover{color:var(--red);}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="about.html">&larr; Back to About Us</a>
    <div class="profile-card">
      <div class="profile-photo-frame">
        <img class="profile-photo" src="images/aina-nadhirah-binti-mohd-khairi.png" alt="Aina Nadhirah binti Mohd Khairi">
      </div>
      <h1>Aina Nadhirah binti Mohd Khairi</h1>
      <p class="profile-role">Executive Officer</p>
      <p class="profile-email"><a href="mailto:aina_nadhirah@uptm.edu.my">aina_nadhirah@uptm.edu.my</a></p>
    </div>
  </div>
</body>
</html>
